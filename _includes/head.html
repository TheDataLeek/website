<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" sizes="any" type="image/svg+xml">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} {{ site.subtitle }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} {{ site.subtitle }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/headshot.jpg' | absolute_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Theme CSS -->
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}" />

  <!-- KaTeX https://katex.org/docs/browser -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
      onload="renderMathInElement(document.body);"></script>

  <!-- Mermaid Diagrams — deferred module runs before DOMContentLoaded, sets window._mermaid -->
  <script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.15.0/+esm';
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  window._mermaid = mermaid;
  </script>

  <!-- Syntax Highlighting -->
  <script src="{{ '/assets/js/highlight.min.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/porple.min.css' | relative_url }}">
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Convert mermaid fenced blocks to div.mermaid before hljs touches them
    document.querySelectorAll('pre > code.language-mermaid').forEach(function(code) {
      var pre = code.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      pre.replaceWith(div);
    });

    // Syntax-highlight all remaining code blocks
    document.querySelectorAll('pre code').forEach(function(block) {
      hljs.highlightElement(block);
    });

    // Add line numbers
    document.querySelectorAll('pre code').forEach(function(block) {
      var lines = (block.textContent || '').split('\n');
      if (lines.length && lines[lines.length - 1] === '') lines.pop();

      var rows = document.createElement('span');
      rows.className = 'line-numbers-rows';
      rows.setAttribute('aria-hidden', 'true');
      for (var i = 0; i < lines.length; i++) {
        rows.appendChild(document.createElement('span'));
      }

      var pre = block.parentElement;
      pre.classList.add('line-numbers');
      pre.appendChild(rows);
    });

    // Collapsible code blocks: pre.code-collapsed (set via kramdown IAL {: .code-collapsed})
    document.querySelectorAll('pre.code-collapsed').forEach(function(pre) {
      var code = pre.querySelector('code');
      var lines = (code ? code.textContent : '').split('\n');
      if (lines.length && lines[lines.length - 1] === '') lines.pop();
      var lineCount = lines.length;

      var wrapper = document.createElement('div');
      wrapper.className = 'code-collapse-wrapper collapsed';

      var btn = document.createElement('button');
      btn.className = 'code-collapse-toggle';
      btn.textContent = 'Show ' + lineCount + ' lines ▼';
      btn.setAttribute('aria-expanded', 'false');
      btn.addEventListener('click', function() {
        var nowCollapsed = wrapper.classList.toggle('collapsed');
        btn.textContent = nowCollapsed
          ? 'Show ' + lineCount + ' lines ▼'
          : 'Hide code ▲';
        btn.setAttribute('aria-expanded', String(!nowCollapsed));
      });

      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(btn);
      wrapper.appendChild(pre);
    });

    // Render mermaid diagrams (window._mermaid is set by the deferred module above)
    if (window._mermaid) window._mermaid.run();
  });
  </script>

  <!-- SVG.js (used by projects/magic) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js" integrity="sha512-EmfT33UCuNEdtd9zuhgQClh7gidfPpkp93WO8GEfAP3cLD++UM1AG9jsTUitCI9DH5nF72XaFePME92r767dHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett" />
</head>
