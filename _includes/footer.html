<footer class="site-footer" role="contentinfo">
  <div class="site-footer__inner">
    <nav class="site-footer__socials" aria-label="Social links">
      {% for key_value in site.socials %}
        {% if key_value[1] %}
          <a href="{{ key_value[1] }}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="{{ key_value[0] }}">{{ key_value[0] }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    <p class="site-footer__copy">
      <button class="site-footer__silly-trigger" aria-label="Toggle silly mode" title="✨"></button>&copy; {{ site.title }} {{ site.subtitle }}
      &middot;
      <a href="https://github.com/thedataleek/website" target="_blank" rel="noopener">Source</a>
    </p>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
