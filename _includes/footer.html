<footer class="site-footer" role="contentinfo">
  <div class="site-footer__inner">
    <nav class="site-footer__socials" aria-label="Social links">
      {% for key_value in site.socials %}
        {% if key_value[1] %}
          <a href="{{ key_value[1] }}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="{{ key_value[0] }}">{{ key_value[0] }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    <p class="site-footer__copy">
      &copy; {{ site.title }} {{ site.subtitle }}
      &middot;
      <a href="https://github.com/thedataleek/website" target="_blank" rel="noopener">Source</a>
    </p>
  </div>
</footer>

<script>
  (function() {
    var toggle = document.querySelector('.site-nav__toggle');
    var nav = document.getElementById('site-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', function() {
        var expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('site-nav--open');
      });
      document.addEventListener('click', function(e) {
        if (!toggle.contains(e.target) && !nav.contains(e.target)) {
          toggle.setAttribute('aria-expanded', 'false');
          nav.classList.remove('site-nav--open');
        }
      });
    }
  })();
</script>
