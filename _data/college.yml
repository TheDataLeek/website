  - id: presentations
    title: Speaking
    description: Talks & Presentations
    image: /assets/images/slidetile.png
    accent: secondary
    intro: I've spoken at academic conferences, local meetups, and professional events over the years.
    projects:
      - title: SIAM 2016
        url: /college/presentations/siam2016
        description: "Using ML to flag poor-quality lab photographs at scale — research from my undergrad position, presented at SIAM 2016."
      - title: SIAM 2017
        url: /college/presentations/siam2017
        description: "A massively parallel simulation of soliton gas dynamics in 1D systems — the computational methods work from my applied math research assistant role, presented at SIAM 2017."
      - title: Chaos and Collatz
        url: /college/presentations/chaos
        description: "An exploration of the Collatz Conjecture through the lens of chaos theory — built for a college course, but an excuse to think about how simple iterative rules produce complex behavior."
      - title: Simulated Annealing
        url: /college/presentations/politicalboundaries
        description: "The redistricting-via-simulated-annealing project adapted into a Boulder Python talk — computational geometry for a general audience."
      - title: Reusable D3 Charting
        url: /college/presentations/d3reuse
        description: "The Boulder D3 Meetup talk behind the reusable charting writeup — building configurable chart components with ES6 classes."
      - title: "AirB&B Data Analysis"
        url: /college/presentations/evolve
        description: "Expanded the Boston AirBnB interview project into a full talk — analysis pipeline, key findings, and visualization approach."
      - title: "AirB&B Data Visualization"
        url: /college/presentations/airbnb
        description: "The interactive D3 map that went with the talk above — Boston AirBnB listings rendered geospatially."
